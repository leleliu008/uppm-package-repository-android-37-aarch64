  build3:
    strategy:
      fail-fast: false
      matrix:
        pkg: [mpg123, mruby@3.0.0, mruby@3.2.0, msgpack-c, mujs, naabu, nano, nanomsg, nap, nasm, navi, ncdu, ncurses, ndk-pkg-core, neofetch, netcat, nethogs, netpbm, nghttp2, nginx, ninja, nnn, nsh, ntbtls, nuclei, numactl, nushell, oat++, obfs4proxy, oboe, oggz, oha, okta-aws-cli, onefetch, opa, openal-soft, opencc, opencolorio, opencv, openexr, openjpeg, openjph, openlibm, openmpi, openssl, openssl-fips, ops, opus-tools, orbiton, orcc, oxlint, p7zip, packcc, patch, patchelf, pbzip2, pcapplusplus, pcre2grep, pegof, pget, pigz, pjsip, pkgconf, pkg-config, plog, plzip, png, pngcheck, pngquant, pngsplit, poco, potrace, ppkg, prek, procs, progress, proj, proj7, proot2, protobuf, proto-cli, psimd, pup, putty, pv, pybind11, q, qalc, qbittorrent-cli, qpdf, qrencode, quickjs, ragel, rancher, rang, ranger, rapidjson, rav1e, rclone, re2c, recode, restic, resvg, rhash, ripgrep, ripgrep-all, rlwrap, robin-map, rover, rsass, rsign2, rsync, rtmpdump, rtorrent, ruff, rust-analyzer, rustscan, rustup-init, samtools, samurai, sassc, scc, sccache, scdoc, sd, shaderc, shared-mime-info, shc, shell2http, shellharden, shiori, sig, silicon, sjpeg, skcms, sl, slumber, sndfile, soundtouch, span-lite, speex, spirv-cross, spirv-headers, sqlite3, squashfs-tools-ng, starship, stdbuf, stew, sttr, stwolame, stylua, subfinder, superfile, supervisord, suricata, svn-lite, svt-av1, swc, swig, syncthing, sysinfo, szip, taglib, tarlz, tcc, tcl, tcpdump, tcping, tdu, tealdeer, tectonic, tengo, termsvg, terragrunt, tic, tiff, tig, tinyalsa, tinysearch, tl-expected, tlrc, tmux, tokei, toml++, toml11, tor, torsocks, totp-cli, tre, tree, tree-sitter, trietool, trivy, ttyd, ttygif, ttyrec, tut, tweego, twolame, typos, typst, typstyle, uctags, unbound, unixodbc, unrar, unzip, uppm, uppm@0.15.2, uppm@0.15.3, uppm@0.15.4, upx, usbmuxd, utf8.h, util-macros, uutils-coreutils, uv, vale, valijson, vegeta, viddy, vim, virustotal-cli, viu, vulkan-headers, wabt, wasm3, wasmer, wasm-pack, wasmtime, watchexec, wavpack, webhook, webp, webp-pixbuf-loader, websocat, wget, wget2, whois, woff2, wolfssl, wuzz, x264, x265, xcb-proto, xh, xmake, xmlstarlet, xmlutils, xmlwf, xorriso, xpup, xsltproc, xxd, xxhash, xz]

