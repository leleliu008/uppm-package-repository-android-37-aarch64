  build4:
    strategy:
      fail-fast: false
      matrix:
        pkg: [yasm, youtubedr, yq, yyjson, zip, zlib, zlib-ng, zola, zopfli, zoxide, zsh, zstd, zsync]

    runs-on: ubuntu-latest

    steps:
      - run: curl -LO https://raw.githubusercontent.com/leleliu008/ndk-pkg/master/ndk-pkg
      - run: chmod a+x ndk-pkg

      - run: ./ndk-pkg about
      - run: ./ndk-pkg setup
      - run: ./ndk-pkg update

      - run: |
          sed -i 's/libcares//'    ~/.ndk-pkg/repos.d/official-core/formula/curl.yml
          sed -i '/enable-ares/d'  ~/.ndk-pkg/repos.d/official-core/formula/curl.yml
          sed -i 's/libcares//'    ~/.ndk-pkg/repos.d/official-core/formula/libcurl.yml
          sed -i '/enable-ares/d'  ~/.ndk-pkg/repos.d/official-core/formula/libcurl.yml

      - run: ./ndk-pkg install android-37-arm64-v8a/${{ matrix.pkg }}

      - name: bundle
        run: |
          set -ex

          for item in $(./ndk-pkg ls-installed)
          do
              ./ndk-pkg bundle "$item" .tar.xz

              PACKAGE_SUMMARY="$(./ndk-pkg show "$item" summary)"
              PACKAGE_WEB_URL="$(./ndk-pkg show "$item" web-url)"
              PACKAGE_VERSION="$(./ndk-pkg show "$item" version)"

              PACKAGE_NAME="${item#*/}"

              PACKAGE_FILENAME="$(ls ${PACKAGE_NAME%@*}-$PACKAGE_VERSION-*.tar.xz)"

              PACKAGE_BIN_SHA="$(sha256sum "$PACKAGE_FILENAME" | cut -d ' ' -f1)"

              PACKAGE_BIN_URL="https://github.com/${{ github.repository }}/releases/download/@TAGNAME@/$PACKAGE_FILENAME"

              cat > "$PACKAGE_NAME.yml" <<EOF
          summary: $PACKAGE_SUMMARY
          webpage: $PACKAGE_WEB_URL
          version: $PACKAGE_VERSION
          bin-url: $PACKAGE_BIN_URL
          bin-sha: $PACKAGE_BIN_SHA
          EOF
          done

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.pkg }}
          path: |
            ./*.tar.xz
            ./*.yml

  publish:
    needs: [build1, build2, build3, build4]

    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: .
          merge-multiple: true

      - run: ls

      - id: tagname
        run: |
          TAGNAME="$(date +%Y.%m.%d)"
          printf 'TAGNAME=%s\n' "$TAGNAME" >> "$GITHUB_OUTPUT"

      - run: sed -i 's|@TAGNAME@|${{ steps.tagname.outputs.TAGNAME }}|' *.yml

      - run: mv *.yml formula/

      - run: |
          DIRNAME="uppm-formula-repository-android-37-aarch64-${{ steps.tagname.outputs.TAGNAME }}"

          install -d "$DIRNAME"

          cp -r formula "$DIRNAME/"

          tar cvJf "$DIRNAME.tar.xz" "$DIRNAME"

      - run: |
          gh release create ${{ steps.tagname.outputs.TAGNAME }} --title ${{ steps.tagname.outputs.TAGNAME }} --notes 'These packages are created by [ndk-pkg](https://github.com/leleliu008/ndk-pkg)'

          for f in *.tar.xz
          do
            sleep 1s
            gh release upload ${{ steps.tagname.outputs.TAGNAME }} "$f"
          done

      - run: git config --global user.name  leleliu008
      - run: git config --global user.email leleliu008@gmail.com

      - run: git pull
      - run: git add formula
      - run: git commit -m 'release new version ${{ steps.tagname.outputs.TAGNAME }}'
      - run: git push origin master
